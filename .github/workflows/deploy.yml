# 把项目构建成静态站点并发布到 GitHub Pages。
# 前置：仓库 Settings -> Pages -> Source 选择 "GitHub Actions"。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          # pnpm 11 要求 Node >= 22.13，因此不能用 Node 20
          node-version: 22
      - uses: pnpm/action-setup@v4
        # 不写 version：让 action 读取 package.json 里的 packageManager，
        # 避免「workflow 里写 9、package.json 里写 11」导致的
        # "Multiple versions of pnpm specified" 报错（已实测踩过）。
      - run: pnpm install --frozen-lockfile
      # 部署前重复跑一遍质量门禁，避免「测试挂了但页面照发」
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
