<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="description" content="Nonogram Online（数织工坊）· 在线数织（Nonogram / Picross）游戏：自动生成谜题、算法难度分级、自定义编辑器、成绩存档。由 deepseek-v4.1-flash 生成。" />
    <title>Nonogram Online · 数织工坊</title>
    <script>
      // 在 React 挂载前应用主题，避免闪烁
      (function () {
        try {
          var raw = localStorage.getItem('nonogram-settings-v1');
          var theme = raw ? JSON.parse(raw).state.theme : 'system';
          var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
